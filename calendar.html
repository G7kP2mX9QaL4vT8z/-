<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族カレンダー - 予定一覧</title>
    <link rel="icon" href="calendaricon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="member-legend">
                <h3>メンバー</h3>
                <ul id="member-list"></ul>
            </div>
            <div class="upcoming-events">
                <h3>今日の予定</h3>
                <div id="upcoming-list">読み込み中...</div>
                <h3>今日の家事</h3>
                <div id="today-housework-list">読み込み中...</div>
                <div class="selected-day-housework">
                    <h3>この日の家事分担</h3>
                    <div id="selected-date-label" class="selected-date-label">今日</div>
                    <div id="selected-day-housework-list">読み込み中...</div>
                </div>
            </div>
        </aside>

        <!-- メインカレンダーエリア -->
        <main class="calendar-main">
            <header class="calendar-header">
                <div class="header-center">
                    <button class="arrow-btn" onclick="changeMonth(-1)">&#10094;</button>
                    <h2 id="current-month-display">年月読み込み中...</h2>
                    <button class="arrow-btn" onclick="changeMonth(1)">&#10095;</button>
                </div>
                <div class="header-right">
                    <button class="add-btn" onclick="openAddModal()">+予定を追加</button>
                    <button class="add-btn housework-add-btn" onclick="openHouseworkModal()">+家事を追加</button>
                    <button class="settings-btn" onclick="openHouseworkSettings()">家事設定</button>
                    <button class="settings-btn" onclick="openFamilySettings()">家族設定</button>
                </div>
            </header>

            <!-- カレンダー本体 -->
            <div id="calendar-grid" class="calendar-grid">
                <!-- JavaScriptで内容を生成 -->
            </div>
        </main>
    </div>

    <!-- 予定追加用のモーダル（初期は非表示） -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-content">
            <h3>予定を追加</h3>
            <div class="modal-body">
                <div class="event-form-row">
                    <label for="event-date">選択した日付：</label>
                    <input type="date" id="event-date">
                </div>
                <div class="event-form-row">
                    <label for="event-member">メンバー：</label>
                    <select id="event-member"></select>
                </div>
                <textarea id="event-plan" rows="4" placeholder="予定を入力"></textarea>
            </div>
            <div class="modal-buttons">
                <button onclick="submitEvent()" class="primary-button">予定を追加</button>
                <button onclick="closeAddModal()" class="secondary-button">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 家事追加用のモーダル -->
    <div id="housework-modal" class="modal hidden">
        <div class="modal-content">
            <h3>家事を追加</h3>
            <div class="modal-body">
                <div class="event-form-row"><label for="housework-date">選択した日付：</label><input type="date" id="housework-date"></div>
                <div class="event-form-row"><label for="housework-member">メンバー：</label><select id="housework-member"></select></div>
                <div class="event-form-row"><label for="housework-type">家事：</label><select id="housework-type"></select></div>
            </div>
            <button onclick="submitHousework()" class="primary-button">家事を追加</button>
            <button onclick="closeHouseworkModal()" class="secondary-button">キャンセル</button>
        </div>
    </div>

    <!-- 家事設定用のモーダル -->
    <div id="housework-settings-modal" class="modal hidden">
        <div class="modal-content housework-settings-content">
            <h3>家事設定</h3>
            <div id="housework-settings-list"></div>
            <button onclick="saveHouseworkSettings()" class="primary-button">保存</button>
            <button onclick="closeHouseworkSettings()" class="secondary-button">キャンセル</button>
        </div>
    </div>

    <!-- 家族設定用のモーダル -->
    <div id="family-settings-modal" class="modal hidden">
        <div class="modal-content settings-modal-content">
            <h3>家族設定</h3>
            <div class="family-count-row">
                <label for="family-count">家族の人数</label>
                <input type="number" id="family-count" min="1" max="10" onchange="changeFamilyCount()">
            </div>
            <div class="settings-labels"><span>名前</span><span>パスワード</span><span>色</span></div>
            <div id="family-settings-list"></div>
            <div class="modal-buttons">
                <button onclick="saveFamilySettings()" class="primary-button">保存</button>
                <button onclick="closeFamilySettings()" class="secondary-button">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>
