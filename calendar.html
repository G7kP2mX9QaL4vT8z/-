<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族カレンダー - 予定一覧</title>
    <link rel="icon" href="calendaricon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="member-legend">
                <h3>メンバー</h3>
                <ul>
                    <li><span class="dot color-mama"></span> 母</li>
                    <li><span class="dot color-papa"></span> 父</li>
                    <li><span class="dot color-brother"></span> 兄</li>
                    <li><span class="dot color-sister"></span> 妹</li>
                </ul>
            </div>
            <div class="upcoming-events">
                <h3>近日中の予定</h3>
                <div id="upcoming-list">読み込み中...</div>
            </div>
        </aside>

        <!-- メインカレンダーエリア -->
        <main class="calendar-main">
            <header class="calendar-header">
                <div class="header-center">
                    <button class="arrow-btn" onclick="changeMonth(-1)">&#10094;</button>
                    <h2 id="current-month-display">年月読み込み中...</h2>
                    <button class="arrow-btn" onclick="changeMonth(1)">&#10095;</button>
                </div>
                <div class="header-right">
                    <button class="nav-btn" onclick="changeMonth(0)">今日</button>
                    <button class="add-btn" onclick="openAddModal()">+ 予定を追加</button>
                </div>
            </header>

            <!-- カレンダー本体 -->
            <div id="calendar-grid" class="calendar-grid">
                <!-- JavaScriptで内容を生成 -->
            </div>
        </main>
    </div>

    <!-- 予定追加用のモーダル（初期は非表示） -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-content">
            <h3>予定を追加</h3>
            <div class="modal-body">
                <label for="event-date">選択した日付:</label>
                <input type="date" id="event-date">
                <input type="text" id="event-plan" placeholder="予定の内容（例：買い物）">
            </div>
            <div class="modal-buttons">
                <button onclick="submitEvent()" class="primary-button">登録</button>
                <button onclick="closeAddModal()" class="secondary-button">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>
